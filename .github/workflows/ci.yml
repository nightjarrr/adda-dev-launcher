name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  base:
    uses: ./.github/workflows/base.yml

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Dockerfile changes
        id: dockerfile_changed
        run: |
          if git diff HEAD~1 HEAD -- Dockerfile | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Dockerfile (hadolint)
        if: steps.dockerfile_changed.outputs.changed == 'true'
        run: docker run --rm -i ghcr.io/hadolint/hadolint:v2.12.0-debian < Dockerfile

      - name: Set up Docker Buildx
        if: steps.dockerfile_changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        if: steps.dockerfile_changed.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
