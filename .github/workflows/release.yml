name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  pull-requests: read

jobs:
  run_base:
    uses: ./.github/workflows/base.yml

  build:
    needs: run_base
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so hatch-vcs can read the tag

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Build wheel
        run: uv build --wheel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
